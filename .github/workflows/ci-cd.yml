
name: Spring Boot EC2 CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      
      - name: Verify Java Version
        run: |
          java -version
          javac -version
          mvn -version

      - name: Build Spring Boot Application
        run: |
          if [ -f ./mvnw ]; then
            chmod +x ./mvnw
            ./mvnw -B clean package -DskipTests
          else
            sudo apt-get update
            sudo apt-get install -y maven
            mvn -B clean package -DskipTests
          fi

      - name: Prepare JAR
        run: |
          mapfile -t JARS < <(
            find target -maxdepth 1 -type f \
              -name '*.jar' ! -name 'original-*'
          )

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one executable JAR."
            echo "Found: ${#JARS[@]}"
            exit 1
          fi

          cp "${JARS[0]}" app.jar

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          scp -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            app.jar \
            "$EC2_USERNAME@$EC2_HOST:/opt/myapp/app.jar.new"

      - name: Restart Spring Boot Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "mv /opt/myapp/app.jar.new /opt/myapp/app.jar && sudo /usr/bin/systemctl restart myapp"

      - name: Verify Deployment
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$EC2_USERNAME@$EC2_HOST" \
            "systemctl is-active myapp"
